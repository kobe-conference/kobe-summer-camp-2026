<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>QRコード｜第27回 神戸カンファレンス サマーキャンプ 2026</title>
<style>
  @media print {
    body { margin: 0; }
    .no-print { display: none; }
  }
  body {
    font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 48px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,.12);
    max-width: 420px;
    width: 100%;
  }
  .title {
    font-size: 1rem;
    font-weight: 900;
    color: #1a3d1a;
    letter-spacing: .08em;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 1.5rem;
    font-weight: 900;
    color: #f97316;
    letter-spacing: .06em;
    margin-bottom: 24px;
  }
  .qr-img {
    width: 240px;
    height: 240px;
    margin: 0 auto 20px;
    display: block;
    border: 3px solid #1a3d1a;
    border-radius: 12px;
    padding: 8px;
  }
  .label {
    font-size: .78rem;
    color: #6b7280;
    margin-bottom: 6px;
    letter-spacing: .04em;
  }
  .url {
    font-size: .72rem;
    color: #1a3d1a;
    font-weight: 700;
    word-break: break-all;
    background: #f0fdf4;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #bbf7d0;
    margin-bottom: 24px;
  }
  .date-place {
    font-size: .85rem;
    color: #374151;
    line-height: 1.8;
    font-weight: 600;
  }
  .date-place b { color: #f97316; }
  .divider {
    border: none;
    border-top: 1px solid #e5e7eb;
    margin: 20px 0;
  }
  .btn-print {
    margin-top: 24px;
    background: #1a3d1a;
    color: #fff;
    border: none;
    padding: 10px 28px;
    border-radius: 30px;
    font-size: .9rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: .06em;
  }
  .btn-print:hover { opacity: .85; }
</style>
</head>
<body>
<div class="card">
  <div class="title">第27回 神戸カンファレンス</div>
  <div class="subtitle">サマーキャンプ 2026</div>
  <img class="qr-img" src="qr-code-print.png" alt="サマーキャンプ2026 QRコード">
  <div class="label">▼ スマホで読み取り、詳細・お申し込みはこちら</div>
  <div class="url">https://kobe-conference.github.io/kobe-summer-camp-2026/</div>
  <hr class="divider">
  <div class="date-place">
    <b>2026年 8月1日(土)〜8月2日(日)</b><br>
    神戸市立 自然の家 六甲施設
  </div>
  <button class="btn-print no-print" onclick="window.print()">🖨 印刷する</button>
</div>
</body>
</html>
